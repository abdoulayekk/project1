<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Dancing+Script">
    
    <style>
        .placeholder-light::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
        }
        /* Custom class replacing tailwind's tracking-wider */
        .tracking-wider {
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-uppercase tracking-wider" href="{% url 'home' %}" style="font-family: 'Dancing Script', cursive; color: gold;">GADJOUMA</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-3 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'products' %}">Products</a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                </li>
            </ul>
            
            <form class="d-flex mx-auto mb-3 mb-lg-0 w-100" role="search" style="max-width: 400px;" method="post" action="{% url 'findproduct' %}">
                {% csrf_token %}
                <div class="input-group">
                    <input class="form-control bg-secondary text-white border-secondary placeholder-light" type="search" placeholder="Search products..." aria-label="Search" name="prod_search">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </div>
            </form>

            <div class="d-flex align-items-center mb-3 mb-lg-0">
                {% if user.is_authenticated %}
                    <span class="text-white me-3">Welcome, <strong>{{ user.username }}</strong></span>
                    <!-- Fixed the missing class attribute here -->
                    <a href="{% url 'logoutuser' %}" class="btn btn-link text-light text-decoration-none p-0">Logout</a>
                {% else %}
                    <!-- Kept as basic links styled as buttons to keep it clean and clean up unneeded form wrappers -->
                    <a href="{% url 'loginuser' %}" class="btn btn-link text-light text-decoration-none me-2">Login</a>
                    <a href="{% url 'signupuser' %}" class="btn btn-outline-light btn-sm px-3">SignUp</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<!-- Bootstrap 5 JS Bundle (Required for Navbar Toggler/Dropdowns to work) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
